<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ed">
  <title>Việc cần làm</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172321;
      --muted: #64716c;
      --paper: #f4f3ed;
      --panel: #fffefa;
      --line: #dce1d8;
      --green: #245c49;
      --lime: #d4ef76;
      --coral: #c65e48;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background: radial-gradient(ellipse at 12% 8%, #e5edcf 0, transparent 34%), var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 620px);
      margin: 0 auto;
      animation: arrive 420ms ease-out both;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 8vw, 58px);
      font-weight: 500;
      line-height: 1.02;
    }

    .intro {
      margin: 14px 0 30px;
      color: var(--muted);
      font-size: 16px;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 12px 30px #263b2810;
    }

    input[type="text"] {
      min-width: 0;
      flex: 1;
      padding: 11px 12px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
    }

    input[type="text"]::placeholder { color: #8b9690; }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .add-button {
      padding: 0 17px;
      background: var(--green);
      color: white;
    }

    .add-button:hover { background: #194533; }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 30px 2px 12px;
    }

    h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    #task-count { color: var(--muted); font-size: 13px; }

    ul {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 9px 10px 9px 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      animation: arrive 180ms ease-out both;
    }

    .task input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      accent-color: var(--green);
      cursor: pointer;
    }

    .task-label { flex: 1; overflow-wrap: anywhere; }
    .task.done .task-label { color: var(--muted); text-decoration: line-through; }

    .delete-button {
      width: 38px;
      min-height: 38px;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
    }

    .delete-button:hover { background: #fae9e4; color: var(--coral); }

    #empty-state {
      padding: 24px 12px;
      border: 1px dashed #c9d1c7;
      border-radius: 7px;
      color: var(--muted);
      text-align: center;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 440px) {
      body { padding: 34px 16px; }
      .composer { gap: 4px; }
      .add-button { padding: 0 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Gọn một chút, nhẹ cả ngày</p>
    <h1>Việc cần làm</h1>
    <p class="intro">Ghi lại điều bạn muốn hoàn thành hôm nay.</p>

    <form class="composer" id="task-form">
      <input id="task-input" type="text" placeholder="Ví dụ: đọc 10 trang sách" maxlength="120" autocomplete="off" aria-label="Việc cần làm">
      <button class="add-button" type="submit">Thêm việc</button>
    </form>

    <div class="list-heading">
      <h2>Danh sách hôm nay</h2>
      <span id="task-count" aria-live="polite"></span>
    </div>
    <ul id="task-list" aria-label="Danh sách việc cần làm"></ul>
    <p id="empty-state">Chưa có việc nào. Bắt đầu bằng một việc nhỏ nhé.</p>
  </main>

  <script>
    const form = document.querySelector("#task-form");
    const input = document.querySelector("#task-input");
    const list = document.querySelector("#task-list");
    const emptyState = document.querySelector("#empty-state");
    const taskCount = document.querySelector("#task-count");
    const storageKey = "viec-can-lam";
    let tasks = loadTasks();

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(storageKey, JSON.stringify(tasks));
    }

    function renderTasks() {
      list.replaceChildren();
      emptyState.hidden = tasks.length > 0;
      const remaining = tasks.filter((task) => !task.done).length;
      taskCount.textContent = `${remaining} việc còn lại`;

      tasks.forEach((task) => {
        const item = document.createElement("li");
        item.className = task.done ? "task done" : "task";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", `Đánh dấu ${task.text} hoàn thành`);
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const label = document.createElement("span");
        label.className = "task-label";
        label.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", `Xóa ${task.text}`);
        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter((entry) => entry.id !== task.id);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, label, deleteButton);
        list.append(item);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      tasks.unshift({ id: crypto.randomUUID(), text, done: false });
      saveTasks();
      renderTasks();
      form.reset();
      input.focus();
    });

    renderTasks();
  </script>
</body>
</html>
