<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phép nhân đơn giản</title>
  <style>
    body { max-width: 420px; margin: 12vh auto; padding: 24px; font: 16px Arial, sans-serif; background: #f4f7f4; color: #18231f; }
    main { padding: 28px; border-radius: 16px; background: white; box-shadow: 0 8px 30px #17321a18; }
    .numbers { display: flex; align-items: center; gap: 10px; }
    input { width: 42%; padding: 12px; border: 1px solid #ccd6ce; border-radius: 8px; font-size: 18px; }
    button { margin-top: 16px; padding: 12px 18px; border: 0; border-radius: 8px; background: #23734a; color: white; font-size: 16px; cursor: pointer; }
    #result { font-size: 20px; font-weight: bold; color: #23734a; }
  </style>
</head>
<body>
  <main>
    <h1>Phép nhân</h1>
    <p>Nhập hai số để tính kết quả.</p>
    <div class="numbers">
      <input id="a" type="number" placeholder="Số thứ nhất" aria-label="Số thứ nhất">
      <span>×</span>
      <input id="b" type="number" placeholder="Số thứ hai" aria-label="Số thứ hai">
    </div>
    <button id="multiply" type="button">Tính kết quả</button>
    <p id="result" aria-live="polite"></p>
  </main>
  <script>
    const a = document.querySelector("#a");
    const b = document.querySelector("#b");
    const result = document.querySelector("#result");
    document.querySelector("#multiply").addEventListener("click", () => {
      if (a.value === "" || b.value === "") {
        result.textContent = "Vui lòng nhập đủ hai số.";
        return;
      }
      result.textContent = `${a.value} × ${b.value} = ${Number(a.value) * Number(b.value)}`;
    });
  </script>
</body>
</html>
